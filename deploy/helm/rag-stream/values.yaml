# Default Helm values for rag-stream deployment

replicaCount: 2

image:
  repository: rag-stream
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

env:
  environment: "production"
  qdrantUrl: "http://qdrant.default.svc.cluster.local:6333"
  defaultCollection: "documents"
  cragMinConfidenceThreshold: "0.35"
  denseVectorDim: "384"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
