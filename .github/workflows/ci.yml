# Continuous Integration workflow for rag-stream
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch or pull request to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token permissions for read-only CI checks
permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip downloads keyed by pyproject.toml to speed up CI runs
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check src tests

      - name: Run type checker (mypy)
        run: mypy src

      - name: Run unit and integration tests (pytest)
        run: pytest tests/

  container-and-helm:
    name: Docker Build & Helm Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-stream:ci .

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/rag-stream
          helm template rag-stream deploy/helm/rag-stream > /dev/null
